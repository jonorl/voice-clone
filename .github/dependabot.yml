version: 2

# Minor and patch bumps arrive as one PR per ecosystem so the weekly run stays reviewable; majors come separately
# because they are the ones that break things.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Argentina/Buenos_Aires
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Jest 30's own Babel preset still requires Babel 7.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript below 6.1 only; lift this once it supports newer versions.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
      day: monday
      timezone: America/Argentina/Buenos_Aires
    groups:
      server-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The CPU-only builds come from the PyTorch index with a +cpu suffix, which Dependabot cannot resolve.
      - dependency-name: torch
      - dependency-name: torchaudio
      # torchcodec is built against one torch release, so it moves with torch, by hand.
      - dependency-name: torchcodec
      # coqui-tts pins a narrow transformers range and the fine-tuned checkpoint is loaded through both; move them
      # together, by hand, after trying a generation.
      - dependency-name: coqui-tts
      - dependency-name: transformers
      # scipy 1.18 needs Python 3.12; lift this with the python:3.11-slim base image.
      - dependency-name: scipy
        versions: [">=1.18.0"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
      timezone: America/Argentina/Buenos_Aires
    ignore:
      # A new Python minor needs matching torch and coqui-tts wheels; move it by hand.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
