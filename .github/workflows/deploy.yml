name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/**'
  workflow_dispatch:

# Read-only by default; only build-and-deploy widens it, to push the image to GHCR.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          tags: ghcr.io/jonorl/voice-clone:latest
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        # Pinned to a commit because this third-party action receives the VPS SSH key, and tags can be moved.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker compose -f ~/my-VPS/projects/docker-compose.yml pull voice-clone
            docker compose -f ~/my-VPS/projects/docker-compose.yml up -d voice-clone

      # A green deploy only means the container was recreated. This waits until /health reports this commit, so the
      # new container (not the old one) is answering through Caddy with the model mounted, then checks that Gradio
      # still exposes the endpoint the frontend calls.
      - name: Smoke test
        env:
          BASE: https://voice.jonathan-orlowski.dev
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 36); do
            health=$(curl -s --max-time 10 "$BASE/health" || true)
            if echo "$health" | jq -e --arg v "$EXPECTED_VERSION" '.status == "ok" and .version == $v' > /dev/null 2>&1; then
              echo "New version healthy after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "::error::/health did not report status ok for $EXPECTED_VERSION within three minutes. Last response: $health"
              exit 1
            fi
            sleep 5
          done

          curl -fsS --max-time 10 "$BASE/config" | jq -e '[.dependencies[].api_name] | index("generate_speech")' > /dev/null \
            || { echo "::error::Gradio no longer exposes /generate_speech, which the frontend calls"; exit 1; }

          echo "Smoke test passed"
