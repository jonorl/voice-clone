name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets the deploy workflow run the tests before shipping.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Matches the python:3.11-slim image the server runs in.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      # The full requirements, as in the Dockerfile, so a pin the image cannot install fails here rather than on deploy.
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      # The tests stand in for worker.py, so they run without the model.
      - name: Test
        run: python -m pytest
